# Strangler-fig facade. Clients only ever talk to this proxy. Which system answers each request
# is decided by routing.conf, a copy of one file from phases/. Moving a route = editing a map
# line and running `nginx -s reload` (zero downtime). Rolling back = switching to the previous file.

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events { worker_connections 1024; }

http {
    default_type application/json;
    sendfile on;
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    # Which backend served each request, for the cut-over dashboard and for debugging.
    log_format routed '$remote_addr [$time_local] "$request" $status backend=$backend $request_time';
    access_log logs/access.log routed;

    # upstream legacy { ... }  upstream modern { ... }
    include upstreams.conf;

    # map ... $backend, map ... $shadow, map ... $frozen (the current phase)
    include routing.conf;

    server {
        listen 8088;

        # Everything the new system owns outright: the v2 API, the admin panel, API docs and assets.
        location / {
            proxy_pass http://modern;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /up { return 200 'ok'; }

        # The original v1 API surface: routed per method + path by the phase map.
        location /api/ {
            if ($frozen) {
                # Cut-over write freeze: reads keep working, writes wait a few minutes.
                add_header Retry-After 120 always;
                return 503 '{"Message":"The service is being upgraded. Please retry in a few minutes."}';
            }

            mirror /__shadow;
            mirror_request_body off;

            add_header X-Served-By $backend always;
            proxy_pass http://$backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Shadow traffic: a copy of each GET goes to the new system; its answer is thrown away.
        # Writes are never mirrored (they would create data twice).
        location = /__shadow {
            internal;
            if ($shadow = 0) { return 204; }
            proxy_pass http://modern$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Shadow-Request 1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
