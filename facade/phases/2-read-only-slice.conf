# Phase 2: first real slice. Invoice listings are read-only (billing writes them in a nightly batch
# that the migrator syncs), so they are the lowest-risk endpoint to serve from the new system.
map "$request_method:$uri" $backend {
    "~^GET:/api/customers/\d+/invoices$"   modern;
    default                                legacy;
}
map $request_method $shadow {
    GET     1;
    default 0;
}
map $request_method $frozen { default 0; }
