# Phase 3b: the new system owns customers and orders, reads and writes. Legacy is kept running,
# read-only, as the rollback target. Rolling back after this point needs the reverse sync described
# in docs/case-study.md, because new writes exist only in PostgreSQL.
map "$request_method:$uri" $backend {
    default modern;
}
map $request_method $shadow { default 0; }
map $request_method $frozen { default 0; }
