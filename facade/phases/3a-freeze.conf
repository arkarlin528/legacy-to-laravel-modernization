# Phase 3a: cut-over window (a few minutes). Writes get 503 + Retry-After so nothing changes in
# legacy while the migrator runs its final catch-up sync and verification. Reads stay on legacy.
map "$request_method:$uri" $backend {
    "~^GET:/api/customers/\d+/invoices$"   modern;
    default                                legacy;
}
map $request_method $shadow { default 0; }
map $request_method $frozen {
    GET     0;
    HEAD    0;
    default 1;
}
