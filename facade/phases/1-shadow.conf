# Phase 1: shadow traffic. Legacy still answers everything, but every GET is copied to the new
# system (answer discarded) so it warms up under real load and its logs can be compared.
# The parity suite (contract-tests --testsuite=Parity) runs against both backends in this phase.
map "$request_method:$uri" $backend {
    default legacy;
}
map $request_method $shadow {
    GET     1;
    default 0;
}
map $request_method $frozen { default 0; }
